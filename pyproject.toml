[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langfuse-prometheus-exporter"
version = "0.1.0"
description = "Prometheus exporter for the Langfuse Metrics API v2 (traces, latency, cost, tokens, scores)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "langfuse-prometheus-exporter contributors" }]
keywords = ["langfuse", "prometheus", "exporter", "observability", "llm", "metrics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
dependencies = ["prometheus-client>=0.19.0"]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/your-org/langfuse-prometheus-exporter"
Issues = "https://github.com/your-org/langfuse-prometheus-exporter/issues"

[project.scripts]
langfuse-prometheus-exporter = "langfuse_exporter.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
